name: Testes das regras (Emulator)
on:
  workflow_dispatch:
  push:
    branches: [ "revisão-4.4.1", "revisao-4.4.1" ]
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Extrair o pacote
        run: unzip -q final-seguranca-lgpd-4.4.1.zip -d pacote
      - name: Instalar dependências
        working-directory: pacote/final-seguranca-lgpd-4.4.1/testes/regras
        run: npm install --no-audit --no-fund
      - name: Rodar testes no Firestore Emulator
        working-directory: pacote/final-seguranca-lgpd-4.4.1/testes/regras
        run: npm test 2>&1 | tee "$GITHUB_WORKSPACE/resultado-emulator.txt"; exit ${PIPESTATUS[0]}
      - name: Guardar o resultado
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: resultado-emulator, path: resultado-emulator.txt }
